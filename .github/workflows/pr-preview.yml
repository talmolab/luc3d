name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy PR Preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          target-folder: pr/${{ github.event.number }}
          commit-message: "Deploy PR #${{ github.event.number }} preview"

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ## Preview Deployment

            | | |
            |---|---|
            | **Preview URL** | https://luc3d.sleap.ai/pr/${{ github.event.number }}/ |
            | **Commit** | ${{ github.sha }} |

            Compare against the other channels (see `README.md`):

            | | |
            |---|---|
            | **main** | https://luc3d.sleap.ai/ — the live site |
            | **stable** | https://luc3d.sleap.ai/stable/ — alias, redirects to main |
            | **latest** | https://luc3d.sleap.ai/latest/ — newest release, pre-releases included |
            | **dev** | https://luc3d.sleap.ai/dev/ — tip of `main` |

            _This preview will be removed when the PR is closed._

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      # deploy.yml pushes to this same branch from a different workflow with a
      # different concurrency group — and a merge to main starts BOTH that deploy
      # (/dev/) and this cleanup in the same second. A single checkout-then-push
      # lost that race most of the time ("cannot lock ref 'refs/heads/gh-pages'"),
      # leaving merged PRs' previews on the live site. So, like deploy.yml:
      # re-sync to the current gh-pages, re-apply the removal, push, and retry on
      # rejection rather than failing or force-pushing over someone else's work.
      - name: Remove PR preview
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # Never let an unset/odd number turn "pr/$PR_NUMBER" into "pr/" —
          # that would remove EVERY preview.
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::refusing to clean up: PR number is '$PR_NUMBER'"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch -q --depth 1 origin gh-pages
            git checkout -q -B gh-pages FETCH_HEAD
            git reset -q --hard FETCH_HEAD
            git clean -qfdx

            if [ ! -d "pr/$PR_NUMBER" ]; then
              echo "No preview at pr/$PR_NUMBER — nothing to remove."
              exit 0
            fi

            git rm -rq -- "pr/$PR_NUMBER"
            git commit -q -m "Remove PR #$PR_NUMBER preview"

            if git push -q origin HEAD:gh-pages; then
              echo "Removed pr/$PR_NUMBER."
              exit 0
            fi

            echo "::warning::gh-pages push rejected (attempt $attempt/5) --"\
                 "another deploy landed first. Re-syncing."
            sleep $((attempt * 5))
          done

          echo "::error::could not remove pr/$PR_NUMBER from gh-pages after 5 attempts."
          exit 1

      - name: Comment on PR (cleanup)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ## Preview Deployment
            Preview has been removed.
