name: Deploy to GitHub Pages

# luc3d.sleap.ai is a GitHub Pages CUSTOM DOMAIN for this repo, not a separate
# host: talmolab.github.io/luc3d/ 301-redirects to it. Cloudflare sits in front
# of it (proxied DNS), but the origin is Pages.
#
# gh-pages serves five channels:
#
#   /          -- THE LIVE PAGE. The newest FULL (non-pre-release) release,
#                 identical to /stable/. See the warning below.
#   /stable/   -- the same build as root, under a stable-by-name URL.
#   /latest/   -- the newest release INCLUDING pre-releases.
#   /dev/      -- every push to main. Bleeding edge.
#   /pr/<n>/   -- per-PR previews, owned by pr-preview.yml. Never touched here.
#
# Only a full release moves root. A push to main goes to /dev/ alone; a
# pre-release goes to /latest/ alone; republishing an older release moves
# nothing (see the HIGHEST_STABLE check). Root and /stable/ are gated on the
# IDENTICAL condition and written from the same staged tree in the same run, so
# they cannot disagree.
#
# *** ROOT IS THE ONLY TARGET THAT WIPES -- TREAT IT WITH CARE. ***
#
# Every other channel owns its own folder and can only damage itself. Root's
# previous output sits at the TOP of gh-pages, next to every other channel and
# every open PR preview, so it is removed by an explicit keep-list rather than a
# blanket delete. Two rules follow, and breaking either is silent until someone
# notices the site is gone:
#
#   1. ADD A CHANNEL => ADD IT TO THAT KEEP-LIST (the `find ... ! -name` in
#      apply_targets). A channel missing from the list is deleted by the next
#      full release. `stable` is in the list for exactly this reason.
#   2. Root is requested by an explicit `root: true` flag, never by an empty
#      path. The empty/`.`/`/` refusal is kept deliberately so an unset variable
#      still cannot turn `rm -rf "$path"` into `rm -rf` of everything.
#
# LUCID has no build system, so a "build" is just a copy of the repo at that
# ref. The app is already sub-path safe -- the importmap is relative (./lib/...)
# and the test harness resolves against document.baseURI -- which is what lets
# the identical tree serve correctly from every one of these paths with no
# rewriting. (This is the one big simplification over sleap-app's deploy.yml,
# which must rebuild per target to inject VITE_BASE_PATH and stamp
# __APP_VERSION__.)
#
# Releases are published BY HAND -- GitHub's Releases UI, or from a laptop:
#
#   gh release create v0.1.0 --generate-notes
#
# That is deliberate, not an omission. A release created from inside Actions
# with the default GITHUB_TOKEN does NOT fire `release: published` (GitHub
# suppresses workflow chaining from that token), so a "cut a release" helper
# workflow could never trigger this one without a PAT or extra indirection.
#
# Tags must be vX.Y.Z, or vX.Y.Z-N with a NUMERIC pre-release part (v0.2.0-1,
# v0.2.0-2) -- same convention as sleap-app, so the two repos' releases sort
# and read the same way. A tag that doesn't parse fails this workflow loudly
# rather than silently skipping the deploy.

on:
  push:
    branches: [main]
  release:
    types: [published]
  # Manual re-deploy from the Actions tab. The ref picked in "Use workflow
  # from" is what gets deployed -- so to rebuild root, /stable/ or /latest/ by
  # hand, select the TAG there, not a branch. `root` is the promote escape
  # hatch: it publishes the selected ref to the LIVE page, which is otherwise
  # only reached by publishing a full release.
  workflow_dispatch:
    inputs:
      target:
        description: "Channel to deploy the selected ref to"
        type: choice
        default: dev
        options:
          - dev
          - latest
          - stable
          - root
        required: true

# Serialize deploys so two runs can't race on the gh-pages branch. pr-preview.yml
# is a separate workflow with its own group and CAN still push concurrently --
# the push step below retries against a moved remote for exactly that reason.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # No `ref:` needed: on a release event GITHUB_REF is already refs/tags/<tag>,
      # on push it's the pushed commit, and on workflow_dispatch it's whatever ref
      # was selected in the UI. All three are exactly what we want to publish.
      - name: Checkout source
        uses: actions/checkout@v4

      # Resolves which channel path(s) this run writes, as a JSON array of
      # {path, label}. A single release can deploy to TWO paths in one run
      # (root + /latest/), which is why this is a list and why the push below
      # happens exactly once per run.
      #
      # Event fields are passed through env and never interpolated into the
      # script body -- a tag name is attacker-influencable text and must not be
      # able to become shell code.
      - name: Determine deploy targets
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          DISPATCH_TARGET: ${{ inputs.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TARGETS='[]'
          # path, label, is_root. `root` is a SEPARATE flag rather than an
          # empty path on purpose: apply_targets still refuses an empty path
          # outright, so only a caller that deliberately passes true can reach
          # the live page.
          add_target() {
            TARGETS="$(jq -c --arg path "$1" --arg label "$2" --argjson root "${3:-false}" \
              '. + [{path: $path, label: $label, root: $root}]' <<< "$TARGETS")"
          }

          if [ "$EVENT_NAME" = "release" ]; then
            # Fail loud on a tag this workflow can't order. Silently skipping
            # would leave a published release that never reaches the site, with
            # nothing in the run log pointing at why.
            if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$'; then
              echo "::error::tag '$RELEASE_TAG' is not vX.Y.Z or vX.Y.Z-N (numeric"\
                   "pre-release, e.g. v0.2.0-1). Delete the release + tag, retag, republish."
              exit 1
            fi

            # One fetch, reused by both queries below. --paginate without --jq
            # emits several top-level arrays, so stream the elements and re-slurp
            # them into a single array.
            gh api "repos/$REPO/releases?per_page=100" --paginate --jq '.[]' \
              | jq -s '.' > "$RUNNER_TEMP/releases.json"

            # Highest published version, drafts excluded. mode=any counts
            # pre-releases (that's /latest/); mode=stable ignores them (that's
            # root). Sort key puts a full release above a pre-release of the
            # same X.Y.Z, matching sleap-app's ordering.
            highest() {
              jq -r --arg mode "$1" '
                [ .[]
                  | select(.draft == false)
                  | select($mode == "any" or .prerelease == false)
                  | .tag_name as $t
                  | ($t | capture("^v(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(-(?<pre>[0-9]+))?$"))?
                  | select(. != null)
                  | { sortkey: [ (.major|tonumber), (.minor|tonumber), (.patch|tonumber),
                                 (if .pre == null then 1 else 0 end), (.pre // "0" | tonumber) ],
                      tag: $t } ]
                | max_by(.sortkey) | if . == null then "" else .tag end
              ' "$RUNNER_TEMP/releases.json"
            }

            HIGHEST_ANY="$(highest any)"
            HIGHEST_STABLE="$(highest stable)"
            echo "Release $RELEASE_TAG (prerelease=$RELEASE_IS_PRERELEASE);"\
                 "highest stable=$HIGHEST_STABLE, highest any=$HIGHEST_ANY"

            # Both channels only ever move FORWARD. GitHub does not guarantee
            # releases are published in increasing version order -- a backport,
            # or plain human error, can publish an older version after a newer
            # one already exists -- so "always deploy on publish" would silently
            # downgrade the site. Compare against the highest known version
            # instead of assuming this one is it.
            if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
              echo "Pre-release: leaving the live root and /stable/ untouched."
            elif [ "$RELEASE_TAG" = "$HIGHEST_STABLE" ]; then
              # Root FIRST: its wipe then cannot race a sibling written earlier
              # in the same apply loop. The keep-list makes order irrelevant,
              # but relying on only one of the two would be careless.
              add_target "" "$RELEASE_TAG (root)" true
              add_target "stable" "$RELEASE_TAG (stable)"
            else
              echo "::notice::$RELEASE_TAG is not the highest stable release"\
                   "($HIGHEST_STABLE) -- leaving the live root and /stable/ untouched."
            fi

            if [ "$RELEASE_TAG" = "$HIGHEST_ANY" ]; then
              add_target "latest" "$RELEASE_TAG (latest)"
            else
              echo "::notice::$RELEASE_TAG is not the highest release"\
                   "($HIGHEST_ANY) -- leaving /latest/ untouched."
            fi

          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_TARGET" = "root" ]; then
            add_target "" "manual-root $REF_NAME" true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_TARGET" = "stable" ]; then
            add_target "stable" "manual-stable $REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_TARGET" = "latest" ]; then
            add_target "latest" "manual-latest $REF_NAME"
          else
            # Push to main, or a workflow_dispatch with the default target.
            add_target "dev" "dev $REF_NAME"
          fi

          echo "Deploy targets: $TARGETS"
          echo "$TARGETS" > "$RUNNER_TEMP/targets.json"
          echo "count=$(jq 'length' <<< "$TARGETS")" >> "$GITHUB_OUTPUT"
          echo "labels=$(jq -r '[.[].label] | join(", ")' <<< "$TARGETS")" >> "$GITHUB_OUTPUT"

      # Staged OUTSIDE the workspace, because the gh-pages clone below also
      # lives outside it -- neither can end up copying the other into itself.
      # One staging copy serves every target: with no build step, all channels
      # publish byte-identical trees.
      - name: Stage the site
        if: steps.targets.outputs.count != '0'
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site"
          # .github and .claude are repo plumbing with no reason to be served.
          # .gitignore must not ship either: it contains `*.md`, so a copy inside
          # a channel makes the `git add` below skip every .md file and all of
          # docs/. The unanchored pattern matches the basename at any depth, so
          # it catches tests/e2e/.gitignore too.
          # Everything else ships, including tests/ (luc3d.sleap.ai/tests/test-runner.html
          # is a documented entry point) and the vendored lib/.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.gitignore' \
            ./ "$RUNNER_TEMP/site/"

      - name: Deploy to gh-pages
        if: steps.targets.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ steps.targets.outputs.labels }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SITE="$RUNNER_TEMP/site"
          WORKDIR="$RUNNER_TEMP/gh-pages"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"

          apply_targets() {
            local count path is_root
            count="$(jq 'length' "$RUNNER_TEMP/targets.json")"
            for i in $(seq 0 $((count - 1))); do
              path="$(jq -r ".[$i].path" "$RUNNER_TEMP/targets.json")"
              is_root="$(jq -r ".[$i].root // false" "$RUNNER_TEMP/targets.json")"

              if [ "$is_root" = "true" ]; then
                # THE LIVE PAGE. Remove root's OWN previous output while
                # sparing every sibling channel and every PR preview -- they
                # live at this same level, so a blanket delete would take them
                # all. This keep-list is load-bearing: A NEW CHANNEL MUST BE
                # ADDED HERE or the next full release deletes it.
                #   .git   - the repository itself
                #   CNAME  - loses the custom domain for everyone if dropped
                #   dev latest stable pr - the other channels
                find . -maxdepth 1 -mindepth 1 \
                  ! -name '.git' \
                  ! -name 'CNAME' \
                  ! -name 'dev' \
                  ! -name 'latest' \
                  ! -name 'stable' \
                  ! -name 'pr' \
                  -exec rm -rf {} +
                cp -R "$SITE/." .
                continue
              fi

              # Every non-root target is a named sub-folder and only ever
              # touches its own. An empty path here would mean the site root
              # reached WITHOUT the explicit flag above -- i.e. a bug, such as
              # an unset variable -- so refuse rather than letting
              # `rm -rf "$path"` become `rm -rf` of everything.
              if [ -z "$path" ] || [ "$path" = "." ] || [ "$path" = "/" ]; then
                echo "::error::refusing to deploy to the site root without an explicit root flag."
                return 1
              fi
              rm -rf "$path"
              mkdir -p "$path"
              cp -R "$SITE/." "$path/"
            done

            # CNAME is what makes Pages serve this repo at luc3d.sleap.ai;
            # losing it breaks the domain for everyone. It is excluded from the
            # root wipe above, and this is the backstop for the case where it
            # was never there to begin with.
            #
            # No .nojekyll: adding one would change how the LIVE root is served
            # (Jekyll currently drops `_`-prefixed paths). The deployed app has
            # no such files, so this costs nothing.
            [ -f CNAME ] || echo "luc3d.sleap.ai" > CNAME
          }

          # pr-preview.yml pushes to this same branch from a different workflow
          # with a different concurrency group, so the remote can legitimately
          # move out from under us mid-run. Re-sync and re-apply rather than
          # failing the deploy or force-pushing over someone's preview.
          for attempt in 1 2 3; do
            if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
              git checkout -q -B gh-pages FETCH_HEAD
              git reset -q --hard FETCH_HEAD
              git clean -qfdx
            else
              echo "gh-pages does not exist yet -- starting it."
              git checkout -q -B gh-pages
            fi

            apply_targets

            # -f because gh-pages may still carry a TRACKED root .gitignore left
            # by the old pages.yml, and ignore rules cascade into subdirectories
            # -- without this it filters every channel's .md files and all of
            # docs/, which is how /dev/ came to be missing them. The root wipe
            # above clears that file the first time a full release deploys root
            # (the staged tree excludes .gitignore), but -f stays: it covers
            # every run before that, and costs nothing after.
            # Safe: `git clean -qfdx` ran above, so the only untracked paths here
            # are the ones apply_targets just wrote.
            git add -A -f
            if git diff --cached --quiet; then
              echo "No changes to deploy."
              exit 0
            fi

            git commit -q -m "Deploy $LABELS (${DEPLOY_SHA::8})"

            if git push -q origin gh-pages; then
              echo "Deployed: $LABELS"
              exit 0
            fi

            echo "::warning::gh-pages push rejected (attempt $attempt/3) --"\
                 "a PR preview deploy likely landed first. Re-syncing."
            sleep 5
          done

          echo "::error::could not push to gh-pages after 3 attempts."
          exit 1
