<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playback loop check</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: Canvas; color: CanvasText; }
  #grid { display: flex; flex-wrap: wrap; gap: 4px; }
  #grid canvas { width: 240px; height: auto; border: 1px solid GrayText; }
  pre { white-space: pre-wrap; font-size: 12px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.js"></script>
<script type="importmap">
{ "imports": {
    "h5wasm": "/lib/h5wasm/hdf5_hl.js",
    "mediabunny": "/lib/mediabunny/mediabunny.min.mjs",
    "pako": "/lib/pako/pako.esm.mjs"
} }
</script>
</head>
<body>
<h1>LUCID playback loop — real browser check</h1>
<p id="status">running…</p>
<pre id="log"></pre>
<div id="grid"></div>
<script type="module">
/*
 * Opened by tests/e2e/_probe-capabilities.mjs (PAGE=_verify-playback-loop.html)
 * in each installed browser. Runs the app's REAL playback path —
 * OnDemandVideoDecoder + VideoController (loading/video.js) — on test videos
 * whose frame number is burned into the pixels as a 16-bit barcode (row y=32,
 * bit i = block x∈[80i, 80i+80), white = 1; built with ffmpeg geq, see the
 * runner). After every draw it reads the barcode back from each camera's
 * canvas: the frame ACTUALLY PAINTED, compared with the frame the loop
 * overlaid there (drawOverlays' per-view frames) — exact ground truth in any
 * browser, independent of every browser timing API.
 */
import { OnDemandVideoDecoder, VideoController } from '/loading/video.js';

const q = new URLSearchParams(location.search);
const media = JSON.parse(q.get('media') || '{"sets":[]}');
const READBACK = q.get('readback') !== '0';   // 0: measure smoothness only (no GPU read-backs)
if (q.get('loop')) window.LUCID_PLAYBACK_LOOP = q.get('loop');   // 'rvfc' = the previous loop, for A/B
const R = { kind: 'verify', browser: q.get('browser'), run: q.get('run'), ua: navigator.userAgent, sets: {} };
const logEl = document.getElementById('log');
const log = (m) => { logEl.textContent += m + '\n'; };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const nextFrame = () => new Promise(r => requestAnimationFrame(r));
const median = (a) => { const s = a.slice().sort((x, y) => x - y); return s.length ? s[s.length >> 1] : null; };
const beat = (s) => fetch('/progress?browser=' + encodeURIComponent(R.browser) + '&step=' + encodeURIComponent(s) +
    '&hidden=' + document.hidden).catch(() => {});

function readBarcode(ctx) {
    const d = ctx.getImageData(0, 32, 1280, 1).data;
    let v = 0;
    for (let i = 0; i < 16; i++) if (d[(40 + 80 * i) * 4] > 128) v |= (1 << i);
    return v;
}

async function runSet(set) {
    const grid = document.getElementById('grid');
    grid.textContent = '';
    const views = [];
    for (let i = 0; i < set.urls.length; i++) {
        const decoder = new OnDemandVideoDecoder({});
        await decoder.init(set.urls[i]);
        const canvas = document.createElement('canvas');
        canvas.width = 1280; canvas.height = 1024;
        grid.appendChild(canvas);
        views.push({ name: 'cam' + i, decoder, canvas, ctx: canvas.getContext('2d', { willReadFrequently: true }),
                     overlayCanvas: null, overlayCtx: null, videoWidth: 1280, videoHeight: 1024 });
    }
    const fps = views[0].decoder._fps || set.fps;
    const total = Math.min(...views.map(v => (v.decoder.samples || []).length || 1e9));
    const state = { views, currentFrame: Math.round(fps), totalFrames: total, fps, isPlaying: false, speedMultiplier: 1 };

    let measuring = false;
    const draws = [];   // { t, painted:[]|null, overlay:[], est:{} }
    let readMs = 0, reads = 0, lastRead = -1e9, lastReadCost = 0;
    const rawSamples = [];
    let ctrl = null;
    ctrl = new VideoController(state, {
        drawOverlays(f, viewFrames) {
            if (!measuring || !state.isPlaying) return;
            const t0 = performance.now();
            const overlay = views.map(v => (viewFrames && viewFrames[v.name] != null) ? viewFrames[v.name] : f);
            // Read the barcode back on every draw unless that is expensive in
            // this browser (Safari: 35–60 ms per draw for 5–8 canvases, which
            // by itself throttled the page to ~20 Hz): then sample ≤ 4×/s so
            // the check doesn't distort the cadence it measures.
            let painted = null;
            if (READBACK && (lastReadCost < 4 || t0 - lastRead > 250)) {
                painted = views.map(v => readBarcode(v.ctx));
                lastReadCost = performance.now() - t0; readMs += lastReadCost; reads++; lastRead = t0;
            }
            // Fallback views: score candidate frame-index estimators from the
            // loop's own inputs (last rVFC mediaTime + its time, the clock).
            let est = null;
            const fb = ctrl._refreshFallback || [];
            if (painted && fb.some(Boolean)) {
                est = views.map((v, i) => {
                    const fr = fb[i], el = v.decoder._videoEl, fps2 = v.decoder._fps || fps;
                    if (!fr || fr.mt == null) return null;
                    const dt = Math.min(Math.max(0, t0 - fr.at), 100) / 1000 * (el.playbackRate || 1);
                    return {
                        projRound: Math.round((fr.mt + dt) * fps2), projFloor: Math.floor((fr.mt + dt) * fps2 + 1e-6),
                        noProj: Math.round(fr.mt * fps2),
                        clockFloor: Math.floor(el.currentTime * fps2 + 1e-6), clockRound: Math.round(el.currentTime * fps2),
                    };
                });
            }
            let raw = null;
            if (painted && fb[0] && rawSamples.length < 12) {
                const el = views[0].decoder._videoEl;
                raw = { painted: painted[0], overlay: overlay[0], mtIdx: +(fb[0].mt * fps).toFixed(2),
                        sinceCbMs: +(t0 - fb[0].at).toFixed(1), clockIdx: +(el.currentTime * fps).toFixed(2) };
                rawSamples.push(raw);
            }
            draws.push({ t: t0, painted, overlay, est });
        },
        updateSeekbar() {},
    });

    // Time the loop's per-camera video draw (fallback: drawCurrentFrame).
    let vidMs = 0, vidCalls = 0;
    views.forEach(v => {
        const orig = v.decoder.drawCurrentFrame;
        v.decoder.drawCurrentFrame = function () {
            const t = performance.now(); const r = orig.apply(this, arguments);
            if (measuring) { vidMs += performance.now() - t; vidCalls++; } return r;
        };
    });
    // per-refresh record: which primary frame was on screen
    const refresh = [];
    let rafOn = true;
    (async () => { while (rafOn) { const t = await nextFrame(); if (measuring) refresh.push({ t, f: draws.length ? draws[draws.length - 1].overlay[0] : null }); } })();

    ctrl.startPlayback();
    await sleep(1200);                 // warm-up (includes the timestamp check)
    measuring = true;
    const tStart = performance.now();
    await sleep(6000);
    measuring = false;
    const secs = (performance.now() - tStart) / 1000;
    ctrl.stopPlayback();
    rafOn = false;
    views.forEach(v => { try { v.decoder._videoEl.pause(); v.decoder._videoEl.removeAttribute('src'); v.decoder._videoEl.load(); } catch (e) {} });

    // ---- analysis ------------------------------------------------------------
    const n = views.length;
    const exact = new Array(n).fill(0), diffHist = views.map(() => ({}));
    const distinct = new Array(n).fill(0), last = new Array(n).fill(null);
    const spread = {};
    const estScore = {};   // estimator -> { exact, n, hist }
    for (const d of draws) {
        for (let i = 0; i < n; i++) {
            if (d.overlay[i] !== last[i]) { distinct[i]++; last[i] = d.overlay[i]; }
            if (!d.painted) continue;
            const x = d.painted[i] - d.overlay[i];
            if (x === 0) exact[i]++;
            const k = x > 3 ? '>3' : x < -3 ? '<-3' : String(x);
            diffHist[i][k] = (diffHist[i][k] || 0) + 1;
            const e = d.est && d.est[i];
            if (e) for (const [name, val] of Object.entries(e)) {
                const sc = estScore[name] || (estScore[name] = { exact: 0, n: 0, hist: {} });
                const y = d.painted[i] - val; sc.n++; if (y === 0) sc.exact++;
                const kk = y > 3 ? '>3' : y < -3 ? '<-3' : String(y); sc.hist[kk] = (sc.hist[kk] || 0) + 1;
            }
        }
        if (d.painted) { const sp = Math.max(...d.painted) - Math.min(...d.painted);
            const k = sp > 4 ? '>4' : String(sp); spread[k] = (spread[k] || 0) + 1; }
    }
    // refresh cadence of the primary's painted frame
    const iv = []; for (let i = 1; i < refresh.length; i++) iv.push(refresh[i].t - refresh[i - 1].t);
    const per = median(iv) || 16.7, hz = 1000 / per;
    const seq = refresh.filter(r => r.f != null).map(r => r.f);   // primary's overlaid (== painted when aligned) frame
    const steps = {}; for (let i = 1; i < seq.length; i++) { const s = seq[i] - seq[i - 1]; const k = s > 5 ? '>5' : s < 0 ? '<0' : String(s); steps[k] = (steps[k] || 0) + 1; }
    const ratio = hz / fps;   // refreshes per video frame
    const idealRun = ratio < 1 ? [1] : (Math.abs(ratio - Math.round(ratio)) < 0.05 ? [Math.round(ratio)] : [Math.floor(ratio), Math.ceil(ratio)]);
    let run = 1, nRuns = 0, bad = 0; const runs = {};
    for (let i = 1; i < seq.length; i++) {
        if (seq[i] === seq[i - 1]) { run++; continue; }
        if (i - run > 0) { nRuns++; runs[run > 4 ? '5+' : run] = (runs[run > 4 ? '5+' : run] || 0) + 1; if (!idealRun.includes(run)) bad++; }
        run = 1;
    }
    return {
        cameras: n, fps: +fps.toFixed(3), refreshHz: +hz.toFixed(1), seconds: +secs.toFixed(1),
        decoderFps: views.map(v => +(v.decoder._fps || 0).toFixed(3)),
        mp4boxReady: views.map(v => !!v.decoder._mp4Initialized),
        readback: READBACK, loop: window.LUCID_PLAYBACK_LOOP || 'refresh',
        mode: views.map(v => v.decoder._vfTimestamps || 'undecided'),
        drawsPerSec: +(draws.length / secs).toFixed(1),
        alignmentSamples: reads,
        paintedEqualsOverlayPct: exact.map(e => +(100 * e / Math.max(1, reads)).toFixed(1)),
        estimators: Object.fromEntries(Object.entries(estScore).map(([k, v]) => [k, { exactPct: +(100 * v.exact / Math.max(1, v.n)).toFixed(1), hist: v.hist }])),
        paintedMinusOverlay: diffHist,
        distinctPaintedPerSec: distinct.map(x => +(x / secs).toFixed(1)),   // from the overlaid index (== painted when aligned)
        idealNewImagesPerSec: +Math.min(hz, fps).toFixed(1),
        stepsPerRefresh: steps, frameOnScreenRefreshes: runs, idealFrameDuration: idealRun,
        irregularDurationPct: +(100 * bad / Math.max(1, nRuns)).toFixed(1),
        cameraSpread: spread,
        barcodeReadbackMsPerRead: +(readMs / Math.max(1, reads)).toFixed(2),
        videoDrawMsPerCamera: vidCalls ? +(vidMs / vidCalls).toFixed(2) : null,
        rawSamples,
    };
}

(async () => {
    for (const set of media.sets) {
        beat(set.name);
        log('▶ ' + set.name);
        try { R.sets[set.name] = await runSet(set); }
        catch (e) { R.sets[set.name] = { error: String(e && e.stack || e).slice(0, 400) }; }
        log('  ' + JSON.stringify(R.sets[set.name]).slice(0, 600));
    }
    document.getElementById('status').textContent = 'done — reporting';
    try {
        await fetch('/result?browser=' + encodeURIComponent(R.browser) + '&run=' + encodeURIComponent(R.run),
            { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(R) });
        document.getElementById('status').textContent = 'done — reported. You can close this tab.';
    } catch (e) { document.getElementById('status').textContent = 'report failed: ' + e.message; }
})();
</script>
</body>
</html>
